     stroke-linecap="round" stroke-linejoin="round">
    <path class="s" d="M3.6 9.4 7 6.6l3.4 2.8 3.4-2.8 3.4 2.8M3.6 16.4 7 13.6l3.4 2.8 3.4-2.8 3.4 2.8"/>
