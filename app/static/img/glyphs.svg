<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
<!-- RashiKundli glyph set. Drawn here, from primitives, for this repository.
     Nothing is traced and nothing is imported: these are circles, arcs, crosses and arrows - the shapes
     these symbols have always been - set on one 24x24 grid so that the nine grahas, the twelve rashis and
     the three ornaments share a stroke. Stroke 1.6, round caps and joins, no fills except where a dot or
     a body is solid. `currentColor` throughout, so a glyph takes the colour of whatever it sits in.
     If anything external is ever added here, it goes in docs/CREDITS.md with its licence. -->
<defs>
  <style>
    symbol { overflow: visible; }
    .s { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: currentColor; stroke: none; }
  </style>
</defs>

<!-- ============ the nine grahas ============ -->
<symbol id="g-surya" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="6"/><circle class="f" cx="12" cy="12" r="2.1"/></symbol>
<symbol id="g-chandra" viewBox="0 0 24 24"><path class="s" d="M15.8 4.6a8 8 0 1 0 0 14.8 9.2 9.2 0 0 1 0-14.8z"/></symbol>
<symbol id="g-mangal" viewBox="0 0 24 24"><circle class="s" cx="10" cy="14" r="5.2"/><path class="s" d="M14.2 10.2 20 4.4M15.4 4.4H20v4.6"/></symbol>
<symbol id="g-budh" viewBox="0 0 24 24"><circle class="s" cx="12" cy="11" r="4.4"/><path class="s" d="M12 15.4v5M9.4 18h5.2M8.6 4.2a4.6 4.6 0 0 0 6.8 0"/></symbol>
<symbol id="g-guru" viewBox="0 0 24 24"><path class="s" d="M7 8.4C7 5.4 9.6 3.9 12 4.8 14.3 5.7 14.7 8.3 12.7 10.3L8.4 14.4M5.8 14.6H17.8M16.2 4.6V19.8"/></symbol>
<symbol id="g-shukra" viewBox="0 0 24 24"><circle class="s" cx="12" cy="9.4" r="4.8"/><path class="s" d="M12 14.2v6M9.2 17.6h5.6"/></symbol>
<!-- Shani with its ring, as asked: a body and a ring rather than the scythe glyph. -->
<symbol id="g-shani" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="4.6"/><ellipse class="s" cx="12" cy="12" rx="9.4" ry="3.2" transform="rotate(-18 12 12)"/></symbol>
<!-- Rahu and Ketu: the serpent's head and its tail, the two ends of one creature. -->
<symbol id="g-rahu" viewBox="0 0 24 24"><path class="s" d="M5.4 19.4V12a6.6 6.6 0 0 1 13.2 0v7.4"/><circle class="f" cx="9.6" cy="12.4" r="1.1"/><circle class="f" cx="14.4" cy="12.4" r="1.1"/></symbol>
<symbol id="g-ketu" viewBox="0 0 24 24"><path class="s" d="M5.4 4.6V12a6.6 6.6 0 0 0 13.2 0V4.6"/><path class="s" d="M12 18.2v2.4M9.6 20.4h4.8"/></symbol>

<!-- ============ the twelve rashis ============ -->
<symbol id="r-mesha" viewBox="0 0 24 24"><path class="s" d="M12 20V8M12 8a4.4 4.4 0 0 0-8.4-1.6M12 8a4.4 4.4 0 0 1 8.4-1.6"/></symbol>
<symbol id="r-vrishabha" viewBox="0 0 24 24"><circle class="s" cx="12" cy="15.4" r="5"/><path class="s" d="M5.6 4.2a6.6 6.6 0 0 0 12.8 0"/></symbol>
<symbol id="r-mithuna" viewBox="0 0 24 24"><path class="s" d="M8 5.4v13.2M16 5.4v13.2M5.6 5.4h12.8M5.6 18.6h12.8"/></symbol>
<symbol id="r-karka" viewBox="0 0 24 24"><path class="s" d="M4.4 9.2a5.6 5.6 0 0 1 10.4 0M19.6 14.8a5.6 5.6 0 0 1-10.4 0"/><circle class="f" cx="16.6" cy="9.2" r="1.9"/><circle class="f" cx="7.4" cy="14.8" r="1.9"/></symbol>
<symbol id="r-simha" viewBox="0 0 24 24"><circle class="s" cx="8" cy="15.6" r="3.6"/><path class="s" d="M11 13.2c1.6-4 .6-7.4-2-8.2-2.2-.7-3.8 1-3.4 2.6M11 13.2c1.4 1.2 3.4 1.2 5 .2"/></symbol>
<symbol id="r-kanya" viewBox="0 0 24 24"><path class="s" d="M4.6 6.4v9.2M9 6.4v9.2M13.4 6.4v7.4M4.6 6.4a2.2 2.2 0 0 1 4.4 0M9 6.4a2.2 2.2 0 0 1 4.4 0M13.4 13.8a3.8 3.8 0 0 0 5.4 5M15.2 19.6l4.6-3"/></symbol>
<symbol id="r-tula" viewBox="0 0 24 24"><path class="s" d="M3.6 18.4h16.8M3.6 13.6h16.8"/><path class="s" d="M7.6 13.6a4.4 4.4 0 0 1 8.8 0"/></symbol>
<symbol id="r-vrishchika" viewBox="0 0 24 24"><path class="s" d="M3.6 6.6v8.4M8 6.6v8.4M12.4 6.6v8.4M3.6 6.6a2.2 2.2 0 0 1 4.4 0M8 6.6a2.2 2.2 0 0 1 4.4 0M12.4 15l5.2 4.2M14.4 19.8l3.2-.6.6-3.2"/></symbol>
<symbol id="r-dhanu" viewBox="0 0 24 24"><path class="s" d="M4.6 19.4 19.4 4.6M13.4 4.6h6v6M8.4 11.6l4 4"/></symbol>
<symbol id="r-makara" viewBox="0 0 24 24"><path class="s" d="M4.2 6.6c2.6 0 3.4 2.4 3.4 5v4.6M7.6 11.6c0-3 1.6-5 4-5s3.6 2 3.6 4.4c0 2-1 3.4-2.6 3.4-1.2 0-2-.8-2-1.8 0-1.6 2.2-2 3.8-.6 1.6 1.4 1.8 4.6-.8 6"/></symbol>
<symbol id="r-kumbha" viewBox="0 0 24 24"><path class="s" d="M3.6 9.4 7 6.6l3.4 2.8 3.4-2.8 3.4 2.8M3.6 16.4 7 13.6l3.4 2.8 3.4-2.8 3.4 2.8"/></symbol>
<symbol id="r-meena" viewBox="0 0 24 24"><path class="s" d="M7 4.4c-2.6 2.6-2.6 12.6 0 15.2M17 4.4c2.6 2.6 2.6 12.6 0 15.2M3.6 12h16.8"/></symbol>

<!-- ============ ornaments ============ -->
<symbol id="o-om" viewBox="0 0 24 24"><path class="s" d="M6.6 9c0-1.7 1.4-2.9 3-2.9 1.4 0 2.5 1 2.5 2.2 0 1.2-1 2.1-2.2 2.1"/><path class="s" d="M9.9 10.4c2.6 0 4.6 1.9 4.6 4.4 0 2.5-2.1 4.4-4.8 4.4-2.7 0-4.7-1.9-4.7-4.2"/><path class="s" d="M12.6 10.8c1.9-1.6 4.3-1.7 5.9-.5"/><path class="s" d="M15.2 6.4a2.6 2.6 0 0 0 3.9 1.1"/><circle class="f" cx="19.6" cy="3.6" r="1.1"/></symbol>
<symbol id="o-lotus" viewBox="0 0 24 24"><path class="s" d="M12 19.4c-3.4 0-6.2-2.2-7-5.2 2.4-.8 5 0 7 2 2-2 4.6-2.8 7-2-.8 3-3.6 5.2-7 5.2z"/><path class="s" d="M12 16.2c-1.4-1.6-2-3.4-1.6-5.2.4-1.8 1.6-3.2 1.6-3.2s1.2 1.4 1.6 3.2c.4 1.8-.2 3.6-1.6 5.2z"/><path class="s" d="M8.4 15c-1.8-1-3-2.6-3.2-4.4 1.8-.2 3.6.6 4.8 2M15.6 15c1.8-1 3-2.6 3.2-4.4-1.8-.2-3.6.6-4.8 2"/></symbol>
<!-- A figure seated in padmasana, as a line silhouette: head, shoulders, folded legs, hands at rest. -->
<symbol id="o-dhyana" viewBox="0 0 24 24"><circle class="s" cx="12" cy="5.2" r="2.6"/><path class="s" d="M12 8.2c-2.6 0-4.6 2-4.8 4.6-.1 1.4.3 2.6 1 3.6M12 8.2c2.6 0 4.6 2 4.8 4.6.1 1.4-.3 2.6-1 3.6"/><path class="s" d="M4.6 19.4c1.4-2.2 4.2-3.4 7.4-3.4s6 1.2 7.4 3.4c-2 .8-4.6 1.2-7.4 1.2s-5.4-.4-7.4-1.2z"/><path class="s" d="M8.2 16.4c1 .8 2.4 1.2 3.8 1.2s2.8-.4 3.8-1.2"/></symbol>
</svg>
