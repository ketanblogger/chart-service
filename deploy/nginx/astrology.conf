# nginx site for rashikundli.com (apex is canonical, www redirects to it; /hi/ and /mr/ are paths of the same app). Install:
#   sudo cp deploy/nginx/astrology.conf /etc/nginx/sites-available/astrology
#   sudo ln -s /etc/nginx/sites-available/astrology /etc/nginx/sites-enabled/ && sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# First run certbot (deploy/README-DEPLOY.md step 8): it needs the port-80 server block below to be live.
#
# PRIVACY: /order/<token> and ...?token=<token> URLs are credentials for a purchase. The log format below drops the
# query string and the order token, so tokens never reach the access log. Keep it that way.

map $request_uri $loggable_uri {
    ~^(?<path>/order/)[^?]*      "${path}[token]";
    ~^(?<path>[^?]*)\?            "${path}?[query]";
    default                       $request_uri;
}
log_format astrology '$remote_addr - [$time_local] "$request_method $loggable_uri" $status $body_bytes_sent '
                     '"$http_user_agent" $request_time';

limit_req_zone $binary_remote_addr zone=astro_api:10m rate=10r/s;

upstream astrology_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name rashikundli.com www.rashikundli.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://rashikundli.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rashikundli.com www.rashikundli.com;

    ssl_certificate     /etc/letsencrypt/live/rashikundli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rashikundli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # one canonical host: www -> apex (must match BASE_URL)
    if ($host = www.rashikundli.com) { return 301 https://rashikundli.com$request_uri; }

    access_log /var/log/nginx/astrology.access.log astrology;
    error_log  /var/log/nginx/astrology.error.log warn;

    # The site-wide ceiling. One location lifts it - /api/blog/images, where the body IS the file - and
    # that exception is written out at the location itself rather than by raising this number.
    client_max_body_size 256k;        # biggest legitimate body: a Razorpay webhook (a few KB) / a chat message
    server_tokens off;
    # Security headers, CSP and HSTS are set by the app (app/hardening.py) - do not duplicate them here.
    # gzip: the app already compresses HTML/JSON; nginx compresses what it serves itself.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Static files straight from disk. URLs carry ?v=<hash>, so they can be cached for a year.
    location /static/ {
        alias /srv/astrology/app/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Razorpay webhook: the app verifies an HMAC over the RAW body - nginx must pass it through untouched
    # (it does by default; never add body filters / sub_filter / a WAF that re-encodes JSON here). No rate limit:
    # Razorpay retries for 24 h and must not be throttled.
    location = /api/payments/webhook {
        proxy_pass http://astrology_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_read_timeout 30s;
    }

    # BLOG IMAGE UPLOADS, and the one place the site-wide body limit is lifted.
    #
    # The raw request body IS the file, so the 256k ceiling above refused every real hero image with a
    # 413 before the application ever saw it - which is what Blogauto was hitting. 3m rather than
    # something larger: app/blog/config.py enforces BLOG_MAX_IMAGE_KB (2 MiB by default) and counts the
    # body as it reads it, so this only needs enough headroom for that limit plus the request itself.
    # nginx refusing at 3m and the app refusing at 2 MiB means a file in between gets the app's own
    # message rather than an nginx error page.
    #
    # EXACT MATCH, AND BEFORE /api/, because nginx prefers an exact location over a prefix one - but
    # placing it first keeps the file readable in the order it is evaluated. Everything else is what
    # /api/ does: the same rate-limit zone and burst, the same proxy headers. The timeout is 60s rather
    # than 330s, because an upload that has not finished in a minute is a stalled connection, not a
    # long computation - 330s is there for report generation, which this is not.
    location = /api/blog/images {
        client_max_body_size 3m;
        limit_req zone=astro_api burst=40 nodelay;
        proxy_pass http://astrology_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Report generation runs in the background, but POST /api/report (direct API use) can take minutes.
    location /api/ {
        limit_req zone=astro_api burst=40 nodelay;
        proxy_pass http://astrology_app;
        include /etc/nginx/proxy_params;          # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 330s;
    }

    location / {
        proxy_pass http://astrology_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
